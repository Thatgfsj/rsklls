name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test PyO3
        run: |
          cd tests/test_pyo3
          cargo build

      - name: Test cxx
        run: |
          cd tests/test_cxx
          cargo build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          for f in scripts/*.sh; do
            if command -v shellcheck &> /dev/null; then
              shellcheck "$f" || echo "shellcheck not available"
            fi
          done

  skill-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md length
        run: |
          lines=$(wc -l < SKILL.md)
          echo "SKILL.md: $lines lines"
          if [ $lines -gt 200 ]; then
            echo "SKILL.md exceeds 200 lines, consider splitting references"
          fi