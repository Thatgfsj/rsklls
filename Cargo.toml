[package]
name = "rsklls"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/Thatgfsj/rsklls"
description = "Universal Rust skills framework for cross-language development, GUI with Chinese support, and modular capability reuse"
keywords = ["rust", "skills", "ffi", "pyo3", "gui", "chinese"]
authors = ["OpenClaw Community"]
readme = "README.md"
categories = ["development-tools", "gui", "interoperability"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.35", features = ["full"], optional = true }

# FFI
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
cxx = { version = "1.0", optional = true }

# GUI
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
mockall = "0.12"

[features]
default = []
full = ["tokio", "pyo3", "cxx", "eframe"]
pyo3 = ["dep:pyo3"]
cxx = ["dep:cxx"]
gui = ["dep:eframe", "dep:egui"]
async = ["dep:tokio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[lib]
name = "rsklls"
path = "src/lib.rs"

[[bin]]
name = "rsklls-cli"
path = "src/main.rs"
required-features = ["cli"]
