[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenClaw Community <thatgfsj@qq.com>"]
description = "Rust Skills for OpenClaw"

[workspace.dependencies]
# Core
rust-lang-rustls = "0.22"

# FFI
pyo3 = { version = "0.22", features = ["extension-module"] }
cxx = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GUI
eframe = "0.29"
egui = "0.29"

# Utils
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
